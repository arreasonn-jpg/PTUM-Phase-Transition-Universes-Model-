name: PTUM transient quartic extended follow-up

on:
  push:
    branches:
      - 'ptum/independent-trajectory-scan-*'
    paths:
      - '.github/workflows/ptum-transient-followup.yml'
      - 'ptum_task1_scan_worker.py'
      - 'ptum_task1_simulation.py'
      - 'ptum_task1_scan_followup_aggregate.py'
      - 'tests/test_ptum_consistency.py'

permissions:
  contents: read

jobs:
  extended-transient-trajectories:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        trajectory: [90, 91, 92, 93, 94, 95, 96, 97, 98, 99]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install scan dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Run extended trajectory
        run: >-
          python ptum_task1_scan_worker.py
          --trajectory-index ${{ matrix.trajectory }}
          --t-max 240
          --n-points 48001
          --output extended_trajectory_${{ matrix.trajectory }}_result.json
      - name: Upload extended trajectory immediately
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ptum-extended-trajectory-${{ matrix.trajectory }}
          path: extended_trajectory_${{ matrix.trajectory }}_result.json
          if-no-files-found: ignore
          retention-days: 30

  aggregate-extended-follow-up:
    if: always()
    needs: [extended-transient-trajectories]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download extended trajectory artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ptum-extended-trajectory-*
          path: extended-scan-results
          merge-multiple: true
      - name: Validate and summarize extended follow-up
        run: python ptum_task1_scan_followup_aggregate.py --input-dir extended-scan-results
      - name: Upload extended follow-up report
        if: always() && hashFiles('ptum_transient_followup_results.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ptum-transient-followup-report
          path: |
            ptum_transient_followup_results.json
            ptum_transient_followup_report.md
          if-no-files-found: error
          retention-days: 90
