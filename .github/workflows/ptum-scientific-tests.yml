name: PTUM scientific regression tests

on:
  push:
    branches:
      - main
      - 'ptum/full-scan-*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/ptum/full-scan-') || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[FULL-SCAN]') || startsWith(github.event.pull_request.head.ref, 'ptum/full-scan-')))) && format('ptum-full-scan-{0}', github.event.pull_request.number || github.ref) || format('ptum-scientific-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/ptum/full-scan-') && !(github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[FULL-SCAN]') || startsWith(github.event.pull_request.head.ref, 'ptum/full-scan-'))) }}

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip freeze
      - name: Run PTUM regression tests
        run: python -m pytest -q tests/test_ptum_consistency.py
      - name: Run four-trajectory two-scale CI smoke scan
        if: github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ptum/full-scan-'))
        run: python ptum_task1_scan.py --profile ci --output task1_parameter_scan_ci.json
      - name: Upload two-scale CI smoke summary
        if: always() && github.event_name != 'workflow_dispatch' && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ptum/full-scan-'))
        uses: actions/upload-artifact@v7
        with:
          name: ptum-two-scale-ci-smoke
          path: task1_parameter_scan_ci.json
          if-no-files-found: ignore
          retention-days: 30

  full-waterfall-scan:
    # Full scan runs only by explicit PR #2 title opt-in or on an isolated
    # ptum/full-scan-* branch PR. The latter keeps long scans out of PR #2's
    # concurrency group and prevents them from cancelling regular regression CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ptum/full-scan-')) ||
      (github.event_name == 'pull_request' &&
       ((github.event.pull_request.head.ref == 'ptum/scientific-consistency-fixes-2026-11-13' &&
         contains(github.event.pull_request.title, '[FULL-SCAN]')) ||
        startsWith(github.event.pull_request.head.ref, 'ptum/full-scan-')))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install scan dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      # DOP853 is an independent explicit high-order cross-check against
      # the archived Radau and BDF runs; tolerances, grid and RHS guard are unchanged.
      - name: Run complete 100-trajectory high-resolution waterfall scan
        run: >-
          python ptum_task1_scan.py --profile full
          --output task1_parameter_scan_results.json
          --checkpoint task1_parameter_scan_checkpoint.json
          --max-rhs-evaluations 1000000 --rtol 1e-9 --atol 1e-12 --solver-method DOP853
      - name: Upload full and incremental two-field scan summaries
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ptum-two-field-full-scan
          path: |
            task1_parameter_scan_results.json
            task1_parameter_scan_checkpoint.json
          if-no-files-found: ignore
          retention-days: 30

  latex-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-publishers
      - name: Compile manuscript
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex
      - name: Upload compiled manuscript
        uses: actions/upload-artifact@v7
        with:
          name: ptum-manuscript-pdf
          path: main.pdf
          if-no-files-found: error
          retention-days: 30
